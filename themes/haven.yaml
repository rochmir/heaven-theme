# Haven — a rounded Material Design 3 theme for Home Assistant with light/dark mesh-gradient backgrounds
# Based on material-rounded-theme by Nerwyn (https://github.com/Nerwyn/material-rounded-theme), Apache License 2.0
# Modified 2026: restructured, renamed, added gradient backgrounds and variants
# Uses card-mod to change the header to the footer, disable the selection bar, and enable header icon coloring
Haven:
    card-mod-theme: 'Haven'
    modes:
        dark:
            # Background gradient (Aurora default; variants below override this key)
            lovelace-background: >-
                radial-gradient(ellipse 80% 70% at 12% 8%, rgba(66,92,190,0.45), transparent 60%) fixed, radial-gradient(ellipse 70% 60% at 92% 22%, rgba(112,72,180,0.35), transparent 58%) fixed, radial-gradient(ellipse 80% 70% at 68% 98%, rgba(0,96,140,0.35), transparent 60%) fixed, linear-gradient(160deg, #10131f 0%, #151528 50%, #0f1a24 100%) fixed
            <<: &haven_dark
